name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.6.0)"
        required: true
        type: string

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"
      - name: Bump version in shim + all 5 per-arch packages
        run: |
          CURRENT=$(jq -r .version package.json)
          echo "Current version: $CURRENT"
          node scripts/bump-version.cjs "${{ inputs.version }}"
          NEW=$(jq -r .version package.json)
          echo "New version: $NEW"
      - name: Set tag output
        id: tag
        run: echo "value=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
      - name: Commit version bump and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json packages/*/package.json
          git diff --staged --quiet \
            || git commit -m "chore: release v${{ inputs.version }}"
          git tag -a "v${{ inputs.version }}" \
            -m "Release v${{ inputs.version }}"
          git push origin main --follow-tags

  build:
    needs: bump
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            binary: arc
          - os: ubuntu-24.04-arm
            target: linux-arm64
            binary: arc
          - os: macos-15-intel
            target: darwin-x64
            binary: arc
          - os: macos-latest
            target: darwin-arm64
            binary: arc
          - os: windows-latest
            target: win32-x64
            binary: arc.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"
      - run: bun install
      - run: bun build src/index.ts --compile --outfile ${{ matrix.binary }}
      - uses: actions/upload-artifact@v4
        with:
          name: arc-${{ matrix.target }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  release-github:
    needs: [bump, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: arc-*
      - name: Stage release assets with descriptive names
        run: |
          mkdir -p assets
          cp binaries/arc-linux-x64/arc      assets/arc-linux-x64
          cp binaries/arc-linux-arm64/arc    assets/arc-linux-arm64
          cp binaries/arc-darwin-x64/arc     assets/arc-darwin-x64
          cp binaries/arc-darwin-arm64/arc   assets/arc-darwin-arm64
          cp binaries/arc-win32-x64/arc.exe  assets/arc-win32-x64.exe
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump.outputs.tag }}
          generate_release_notes: true
          files: assets/*

  publish-npm:
    needs: [bump, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Download per-platform binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: arc-*
      - name: Place binaries into per-arch package directories
        run: |
          cp dist/arc-linux-x64/arc      packages/arc-linux-x64/arc
          cp dist/arc-linux-arm64/arc    packages/arc-linux-arm64/arc
          cp dist/arc-darwin-x64/arc     packages/arc-darwin-x64/arc
          cp dist/arc-darwin-arm64/arc   packages/arc-darwin-arm64/arc
          cp dist/arc-win32-x64/arc.exe  packages/arc-win32-x64/arc.exe
          chmod +x packages/arc-linux-x64/arc \
            packages/arc-linux-arm64/arc \
            packages/arc-darwin-x64/arc \
            packages/arc-darwin-arm64/arc
      - name: Publish per-arch packages first
        run: |
          set -e
          for dir in \
            packages/arc-linux-x64 \
            packages/arc-linux-arm64 \
            packages/arc-darwin-x64 \
            packages/arc-darwin-arm64 \
            packages/arc-win32-x64; do
            echo "Publishing $dir"
            (cd "$dir" && npm publish --provenance --access public)
          done
      - name: Publish shim package
        run: npm publish --provenance --access public
